version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILD_MODE: production
    container_name: claude-harness-frontend
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    networks:
      - claude-harness-network
    restart: unless-stopped
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health.json"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  backend:
    image: claude-harness-backend:latest
    container_name: claude-harness-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    networks:
      - claude-harness-network
    restart: unless-stopped

networks:
  claude-harness-network:
    driver: bridge
